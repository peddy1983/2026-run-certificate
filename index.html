<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 New Year Run 完賽證明合成</title>
    <style>
        body {
            font-family: "Microsoft JhengHei", "Arial", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: #333;
            padding: 20px;
            margin: 0;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        h2 { color: #e67e22; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; text-align: left; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
        }
        
        button {
            width: 100%;
            padding: 14px;
            background-color: #e67e22;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.3s;
        }
        button:hover { background-color: #d35400; }
        
        #resultArea { margin-top: 20px; border-top: 1px solid #eee; padding-top: 20px; display: none; }
        
        #previewImage {
            max-width: 100%;
            border: 1px solid #ccc;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            margin-bottom: 10px;
            display: none;
        }

        #certificateCanvas {
            max-width: 100%;
            height: auto;
            border: 1px solid #ccc;
            display: none;
            margin: 0 auto;
        }

        .download-btn {
            display: none;
            text-decoration: none;
            background-color: #27ae60;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            margin-top: 10px;
            cursor: pointer;
        }
        
        .loading { color: #888; display: none; margin-top: 10px;}
        .error-msg { color: red; margin-top: 10px; display: none; }
        .tips { font-size: 14px; color: #666; margin-top: 10px; display: none; text-align: left; background: #fff3cd; padding: 10px; border-radius: 5px;}
    </style>
</head>
<body>

<div class="container">
    <h2>🏃 2026 完賽證明合成</h2>
    
    <div class="input-group">
        <label>選擇組別 (Category)：</label>
        <select id="raceCategory">
            <option value="5k">5K 組 (5 Kilometers)</option>
            <option value="10k">10K 組 (10 Kilometers)</option>
        </select>
    </div>

    <div class="input-group" style="border-top: 1px dashed #eee; padding-top: 15px;">
        <label style="color: #c0392b;">🧧 選擇證書風格 (Style)：</label>
        <select id="certificateStyle">
            <option value="original">經典原版 (Original Blue)</option>
            <option value="cny">🧨 新春賀歲版 (Lunar New Year)</option>
        </select>
    </div>

    <div class="input-group">
        <label>選手姓名 (Name)：</label>
        <input type="text" id="runnerName" placeholder="例如：CHEN, DA-MING" value="Chen, Da-Ming">
    </div>

    <div class="input-group">
        <label>完賽時間 (Time)：</label>
        <input type="text" id="runnerTime" placeholder="例如：00:57:00" value="00:57:00">
    </div>

    <button onclick="generateCertificate()">製作我的證書</button>
    <p class="loading" id="loadingMsg">圖片生成中...</p>
    <p class="error-msg" id="errorMsg"></p>

    <div id="resultArea">
        <h3>✨ 您的證書</h3>
        <img id="previewImage" alt="證書預覽">
        <canvas id="certificateCanvas"></canvas>
        <a id="downloadLink" class="download-btn" href="#">下載證書 (Download)</a>
        <div id="saveTips" class="tips">
            ⚠️ <b>提示：</b><br>
            若無法點擊下載，請直接對著上方的圖片<br>
            <b>按滑鼠右鍵 -> 另存圖片</b> 即可保存！
        </div>
    </div>
</div>

<script>
    function generateCertificate() {
        const category = document.getElementById('raceCategory').value;
        const style = document.getElementById('certificateStyle').value; 
        const name = document.getElementById('runnerName').value;
        const time = document.getElementById('runnerTime').value;
        
        const loadingMsg = document.getElementById('loadingMsg');
        const errorMsg = document.getElementById('errorMsg');
        const resultArea = document.getElementById('resultArea');
        const previewImg = document.getElementById('previewImage');
        const downloadLink = document.getElementById('downloadLink');
        const canvas = document.getElementById('certificateCanvas');
        const saveTips = document.getElementById('saveTips');

        if (!name || !time) {
            alert("請完整輸入姓名與時間！");
            return;
        }

        loadingMsg.style.display = 'block';
        errorMsg.style.display = 'none';
        resultArea.style.display = 'none';
        previewImg.style.display = 'none';
        canvas.style.display = 'none';
        downloadLink.style.display = 'none';
        saveTips.style.display = 'none';

        const ctx = canvas.getContext('2d');
        const img = new Image();

        // -----------------------------------------------------
        // 參數設定區 (字體大小 +10pt)
        // -----------------------------------------------------
        let textColor = '#1a2b49'; 
        let nameYRatio = 0.733;
        let timeYRatio = 0.814;
        let nameFont = "";
        let timeFont = "";

        if (style === 'cny') {
            // === 新春賀歲版 (CNY) ===
            img.src = (category === '5k') ? 'bg_5k_cny.jpg' : 'bg_10k_cny.jpg';
            
            textColor = '#edc776'; // 金色
            
            // 位置 (維持上次調整的完美位置)
            nameYRatio = 0.76; 
            timeYRatio = 0.81; 

            // 字體加大 (+10pt)：
            nameFont = "bold 70pt 'Microsoft JhengHei', 'Arial Black'"; // 60 -> 70
            timeFont = "bold 65pt 'Impact', 'Arial Narrow'"; // 55 -> 65

        } else {
            // === 經典原版 (Original) ===
            img.src = (category === '5k') ? 'bg_5k.jpg' : 'bg_10k.jpg';
            
            textColor = '#1a2b49'; // 深藍
            
            // 位置 (維持上次調整的完美位置)
            nameYRatio = 0.725; 
            timeYRatio = 0.814; 
            
            // 字體加大 (+10pt)：
            nameFont = "bold 50pt 'Microsoft JhengHei', 'Arial Black'"; // 40 -> 50
            timeFont = "bold 44pt 'Impact', 'Arial Narrow'"; // 34 -> 44
        }

        img.onload = function() {
            canvas.width = img.width;
            canvas.height = img.height;
            ctx.drawImage(img, 0, 0);

            const centerX = canvas.width / 2;

            // 設定文字垂直對齊中心 (Middle)
            ctx.textBaseline = 'middle';
            ctx.textAlign = 'center';

            // --- 繪製姓名 ---
            ctx.font = nameFont;
            ctx.fillStyle = textColor; 
            ctx.fillText(name.toUpperCase(), centerX, canvas.height * nameYRatio); 

            // --- 繪製時間 ---
            ctx.font = timeFont;
            ctx.fillStyle = textColor; 
            ctx.fillText(time, centerX, canvas.height * timeYRatio);

            loadingMsg.style.display = 'none';
            resultArea.style.display = 'block';

            try {
                const dataURL = canvas.toDataURL('image/jpeg', 0.9);
                previewImg.src = dataURL;
                previewImg.style.display = 'block';
                downloadLink.href = dataURL;
                downloadLink.download = `Certificate_${style}_${name}.jpg`;
                downloadLink.style.display = 'inline-block';
            } catch (e) {
                console.log("本機模式：切換為 Canvas 直接顯示");
                canvas.style.display = 'block';
                saveTips.style.display = 'block';
            }
        };

        img.onerror = function() {
            loadingMsg.style.display = 'none';
            let missingFile = (style === 'cny') ? `bg_${category}_cny.jpg` : `bg_${category}.jpg`;
            errorMsg.innerHTML = `❌ 找不到底圖檔案！<br>請確認資料夾內是否有 <b>${missingFile}</b>`;
            errorMsg.style.display = 'block';
        };
    }
</script>

</body>
</html>
